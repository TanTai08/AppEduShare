services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edushare
      POSTGRES_USER: edushare
      POSTGRES_PASSWORD: ${EDUSHARE_DB_PASSWORD:-edushare_dev}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - edushare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edushare -d edushare']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  edushare_pg:
