name: EduShare CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: edushare_test
          POSTGRES_USER: edushare
          POSTGRES_PASSWORD: edushare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edushare -d edushare_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://edushare:edushare_test@localhost:5432/edushare_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:sdk -w apps/mobile
      - run: npm run check
      - run: npm run build:native -w apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: edushare-web
          path: apps/mobile/dist
