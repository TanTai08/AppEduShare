name: EduShare CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:sdk -w apps/mobile
      - run: npm run check
      - run: npm run build:native -w apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: edushare-web
          path: apps/mobile/dist
